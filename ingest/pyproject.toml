[project]
name = "audit-xlsx"
version = "0.1.0"
description = "Fetch DART audit reports for KOSPI/KOSDAQ stocks and export to XLSX"
requires-python = ">=3.11"
dependencies = [
  "opendartreader>=0.2.5",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "lxml>=5.0",
  "requests>=2.31",
]

[project.scripts]
audit-xlsx = "audit_xlsx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audit_xlsx"]
