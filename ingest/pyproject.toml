[project]
name = "dart-kam-ingest"
version = "0.1.0"
description = "OPENDART ingestion and parsing for audit reports / KAM"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "lxml>=5.0",
]

[project.scripts]
dart-kam = "dart_kam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dart_kam"]
